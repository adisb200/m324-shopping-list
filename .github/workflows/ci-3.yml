name: CI Pipeline - Multiple Jobs

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm ci

  lint:
    runs-on: ubuntu-22.04
    needs: build
    steps:
     - name: Lint
       run: npm run lint

  test:
    runs-on: ubuntu-22.04
    needs: build
    steps:
     - name: Test
       run: npm run test

  deploy:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - name: Deploy
        run: echo "Deploy Application"